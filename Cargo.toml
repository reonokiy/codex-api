[package]
name = "codex-api-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
codex-context-fragments = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-websocket-client = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
tokio-tungstenite = "0.28"
zstd = "0.13"
anyhow = "1"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["json", "http1", "tokio", "ws", "multipart"] }
bytes = "1"
base64 = "0.22.1"
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2.3"
futures = "0.3"
http = "1"
http-body = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_ignored = "=0.1.14"
tokio = { version = "1", features = ["full"] }
toml = "0.9.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = "0.31"
opentelemetry_sdk = "0.31"
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
uuid = { version = "1", features = ["v4", "v5"] }
codex-api = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-client = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-login = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-model-provider = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-model-provider-info = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-models-manager = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }
codex-config = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }


codex-features = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }

codex-tools = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }

codex-exec-server = { git = "https://github.com/openai/codex.git", rev = "d32063f96c2dff1dc96af839b3952abb6acfeda4" }

[dev-dependencies]
opentelemetry_sdk = { version = "0.31", features = ["testing"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
tempfile = "3"

# Cargo does not inherit dependency workspace patches; these match Codex.
[patch.crates-io]
# Match upstream SQLx SQLite compatibility patches.
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "ed1cdab335221515706178d68495bba2aed1924f" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch."https://github.com/openai/codex.git"]
codex-api = { path = "vendor/codex-api" }

[workspace]
members = [".", "vendor/codex-api", "xtask"]
default-members = ["."]
resolver = "3"
