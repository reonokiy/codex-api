[package]
name = "codex-api-gateway"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"

[dependencies]
codex-context-fragments = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-websocket-client = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
tokio-tungstenite = "0.28"
zstd = "0.13"
anyhow = "1"
async-stream = "0.3.6"
axum = { version = "0.8", features = ["json", "http1", "tokio", "ws"] }
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2.3"
futures = "0.3"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["full"] }
toml = "0.9.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
codex-api = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-client = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-http-client = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-login = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-model-provider = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-model-provider-info = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-models-manager = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-protocol = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }
codex-config = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }


codex-features = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }

codex-tools = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }

codex-exec-server = { git = "https://github.com/openai/codex.git", rev = "f0a1b8f0849d90960bc406b848f32e5a129b0457" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3"

# Cargo does not inherit dependency workspace patches; these match Codex.
[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[patch."https://github.com/openai/codex.git"]
codex-api = { path = "vendor/codex-api" }

[workspace]
members = [".", "vendor/codex-api"]
default-members = ["."]
resolver = "3"
